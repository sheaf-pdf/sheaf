[package]
name = "sheaf-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Forms and encrypted files built in code, the lookup for Greg's corpus
# of real ones (`forms::fixture`, `serialize::fixture`, `forms::corpus`)
# and the Arlington checker (`arlington`), for other crates' tests.
fixtures = []

[dependencies]
# Random mark ids, so copies of a file never hand out the same one, and
# save temp names no other save uses.
fastrand = "2"
sheaf-util.workspace = true
# The edit vocabulary, and the types its records share with it (M10.5
# §6.1).
sheaf-edit.workspace = true
# How far an open has read (M10.5 §14.2).
in-progress.workspace = true
lopdf.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
im.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# Image pages: decoding and G4 come from sheaf-image; Flate is ours.
sheaf-image.workspace = true
flate2 = "1"
# Stamps from images keep their transparency (a soft mask).
image.workspace = true
# XFDF, comments as XML (M9 slice 18); XMP's conformance claims.
quick-xml = "0.41"
# A file's password is wiped from memory when its blob goes.
zeroize = "1.9"
# AES IVs a save writes are keyed hashes of what they encrypt (M10.5 §11.7).
hmac = "0.13"
sha2 = "0.11"
# Whether a signature still signs the file's bytes (B5): its CMS read as
# BER, which real files need (cms 0.2's DER rules refuse a quarter of the
# corpus's), and its /ByteRange hashed by the algorithm it names. cms 0.3
# is a pre-release, so pinned exactly: revisit at M12's kickoff, which
# builds signing and verifying on the same line.
cms = { version = "=0.3.0-rc.0", default-features = false }
der = { version = "0.8", features = ["ber", "alloc", "oid", "derive"] }
sha1 = "0.11"
md-5 = "0.11"
# RSA's public operation, which opens a signature value with no signed
# attributes to the digest it holds (B5); in the tree already, imageproc's.
num-bigint = { version = "0.4", default-features = false }
# Text in a mark's staleness digest is NFC, whatever another tool wrote
# (M10.5 §3.6).
unicode-normalization = "0.1"
# What a change means for saving and signatures, as sets (M10.5 §7.1).
bitflags.workspace = true
# The date and time a mark's identity tokens are filled in with, as the
# user's settings write them (M10.5 §6.8).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The predefined CMaps a Type0 font's /Encoding names (ISO 32000-1 Table
# 118, and Adobe-*-UCS2 for a CID's text), bundled: each code's CID, and
# its text where the font has no /ToUnicode (M11 slice 3). Only its own
# bundle is parsed, never a file's bytes. Adobe's CMap data is under
# BSD-3, its notice in packaging/licenses (LICENSE-cmap-resources); the
# bundle is brotli, so the full brotli crate comes with it (LICENSE-brotli).
hayro-cmap = "0.1"
# The font programs files embed (TrueType, CFF and Type 1), read for each
# glyph's outline box and a font's heights as PDFium's FreeType reads them
# (M11 slice 3); read-fonts comes with it, as skrifa::raw. 0.44 is the
# version the Linux app's GPUI already builds, so the two share one.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[dev-dependencies]
# Every op as Op JSON, which seeds the fuzzing of transactions.
sheaf-edit = { workspace = true, features = ["fixtures"] }
image.workspace = true
env_logger.workspace = true
# Random field trees for the form reader (M10 slice 2).
proptest = { version = "1", default-features = false, features = ["std"] }
# The retired-symbols ledger reads the workspace's code (M10.5 slice 1),
# and says where each hit is.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
