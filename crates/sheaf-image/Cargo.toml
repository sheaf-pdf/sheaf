[package]
name = "sheaf-image"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Image in, image out: scan cleanup, blank pages, barcodes and other pixel work for sheaf, with no PDFs"
publish = false

[features]
# Codes drawn, synthetic pages and the bench's degradations
# (`codes::fixture`), for this crate's tests and other crates'.
fixtures = []

[dependencies]
in-progress.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
image = { workspace = true, features = ["jpeg", "tiff", "bmp", "gif", "webp"] }
# Multi-page TIFF in and out, CCITT G4, and PNG with its resolution.
tiff = "0.11"
fax = "0.2"
png = "0.18"
# Barcodes read and QR codes written (M5 separators); without its default
# features, so its exact `image` pin and imageproc 0.25 stay out.
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "encoders", "encoding_rs", "oned", "qrcode", "datamatrix", "pdf417"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
