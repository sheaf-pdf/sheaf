# The fuzz targets (M10.5's "Tests, fixtures and gates"), in cargo-fuzz's
# layout, outside the workspace: they build on nightly with libFuzzer.
# `.github/workflows/fuzz.yml` runs each nightly; locally:
#
#   cargo +nightly fuzz run lazy_reader -- -dict=fuzz/pdf.dict
#   cargo +nightly fuzz run op_json -- -dict=fuzz/op.dict
#
# Each target calls a body in `sheaf_doc::source::fuzz`, which a stable
# test (`fuzz_bodies_survive_mutated_fixtures`) runs too.
[package]
name = "sheaf-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `op_json`'s document is built from sheaf-doc's form and mark fixtures.
sheaf-doc = { path = "../crates/sheaf-doc", features = ["fixtures"] }

# sheaf-doc's lopdf is the workspace's patched one (vendor/lopdf/SHEAF.md);
# a workspace's patches don't reach a crate outside it.
[patch.crates-io]
lopdf = { path = "../vendor/lopdf" }

[[bin]]
name = "lazy_reader"
path = "fuzz_targets/lazy_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_tree"
path = "fuzz_targets/page_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sheaf_annot"
path = "fuzz_targets/sheaf_annot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "splice"
path = "fuzz_targets/splice.rs"
test = false
doc = false
bench = false

[[bin]]
name = "op_json"
path = "fuzz_targets/op_json.rs"
test = false
doc = false
bench = false
