[workspace]
resolver = "3"
# Plugins build for wasm32-wasip2 in their own workspaces. vendor/lopdf is
# a patched dependency, not one of ours (its SHEAF.md). fuzz/ builds on
# nightly, with libFuzzer.
exclude = ["plugins", "crates/sheaf-plugin/tests/fixtures", "vendor/lopdf", "fuzz"]
members = [
    "crates/sheaf-util",
    "crates/sheaf-edit",
    "crates/sheaf-ops",
    "crates/sheaf-image",
    "crates/sheaf-cli",
    "crates/sheaf-doc",
    "crates/sheaf-render",
    "crates/sheaf-ui",
    "crates/sheaf-ocr",
    "crates/sheaf-print",
    "crates/sheaf-plugin",
    "crates/sheaf-plugin-api",
    "crates/sheaf-app",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/sheaf"
rust-version = "1.98"

[workspace.dependencies]
sheaf-util = { path = "crates/sheaf-util" }
# Versioned as well: the plugin SDK (`sheaf-plugin-api`) depends on it.
sheaf-edit = { path = "crates/sheaf-edit", version = "0.1.0" }
sheaf-doc = { path = "crates/sheaf-doc" }
sheaf-render = { path = "crates/sheaf-render" }
sheaf-ui = { path = "crates/sheaf-ui" }
sheaf-ocr = { path = "crates/sheaf-ocr" }
sheaf-print = { path = "crates/sheaf-print" }
sheaf-plugin = { path = "crates/sheaf-plugin" }
sheaf-ops = { path = "crates/sheaf-ops" }
sheaf-image = { path = "crates/sheaf-image" }
sheaf-cli = { path = "crates/sheaf-cli" }

# GPUI comes from gpui-pre: Longbridge's weekly crates.io snapshot of Zed
# main, its crates renamed gpui-pre-*. 0.3.9 is zed@93d7456. The sources are
# Zed's at that commit plus a few packaging edits marked "Modified for
# gpui-pre" (at 0.3.9: `$crate` paths in `actions!`, a gpui-kit path facade
# in the proc macros that does nothing unless the crate depends on gpui-kit,
# vendored sources for gpui-pre-apple's build.rs). sheaf keeps no patches
# against Zed, so it lets gpui-pre do the snapshotting. gpui-pre doesn't
# follow semver and breaking changes are routine: pin it exactly and bump it
# deliberately, with a compatibility check (README, "Updating GPUI").
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland", "x11"] }

# PDF engines. NOTE: the `pdfium` crate (newinnovations) is GPL-3 — do not use it.
pdfium-render = "0.9.4"
lopdf = "0.45"

anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"
futures = "0.3"
smallvec = "1"
# Sets of flags: what a change means for saving (sheaf-doc's effects).
bitflags = "2"
unicode-segmentation = "1"
im = "15"
# The document a plugin call reads, swapped in as it changes (sheaf-plugin).
arc-swap = "1.9.2"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
# Progress and cooperative cancel for ops, the CLI bar and plugin tasks:
# sheaf's own crate, published as sheaf-pdf/in-progress.
in-progress = "0.1"
# One sheaf per user and state folder: a later launch hands its files to
# the running sheaf. sheaf's own crate, published as
# sheaf-pdf/instance-handoff. Pinned exactly, as its README asks: until
# 0.1.0 a later alpha may change the API and what two builds share.
instance-handoff = "=0.1.0-alpha.1"

# Zed's workspace patches for crates GPUI uses, mirrored from the
# [patch.crates-io] of Zed's Cargo.toml at the snapshot's rev.
# Zed builds GPUI against these forks, but a published crate can't carry
# patches (gpui-pre's crates ask for the crates.io releases), so they are
# repeated here; keep them in step with Zed's on every bump. async-task is
# in every build, async-process, calloop and khronos-egl in the Linux one;
# windows-capture builds only with GPUI's screen-capture feature (off).
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
# Also Zed's build, though not from its patch block: Zed's
# crates/gpui_linux/Cargo.toml takes xim from its xim-rs fork at this rev,
# but the crates.io zed-xim that gpui-pre asks for resolves xim-ctext 0.3.0
# (2022). That can't decode unescaped Latin-1 (é from a dead key or
# Compose), ISO-8859 parts, GB2312 or KS C 5601, and zed-xim `expect`s the
# decode, so under X11 an input method (ibus, fcitx) committing any of them
# panics. Drop this once a zed-xim release depends on xim-ctext 0.4.
xim-ctext = { git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8" }

# Not Zed's. lopdf 0.45.0 reads an earlier revision of some hybrid-reference
# files (todos/m10.md, slice 2's note). vendor/lopdf is lopdf's main at
# 39492cb, which fixes that (#598) and brings 22 other commits since 0.45.0,
# a refactor of the reader, writer and encryption code among them. sheaf's
# patch on top adds LazyPdf (each object read when it's asked for, under
# caps), reads each cross-reference stream once, reads reals as f64s and
# encrypts and decrypts each string and stream as ISO 32000 has it.
# vendor/lopdf/SHEAF.md has the details, and why the way back to crates.io
# is now upstreaming the patch.
lopdf = { path = "vendor/lopdf" }

[profile.dev]
# GPUI and PDFium bindings are unusably slow unoptimized; mirror Zed's approach.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Debug info for backtraces from users is worth more than the disk; keep
# panics unwinding so the save path can report instead of abort.
