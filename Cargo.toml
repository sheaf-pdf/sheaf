[workspace]
resolver = "3"
# Plugins build for wasm32-wasip2 in their own workspaces. fuzz/ builds on
# nightly, with libFuzzer.
exclude = ["plugins", "crates/sheaf-plugin/tests/fixtures", "fuzz"]
members = [
    "crates/sheaf-util",
    "crates/sheaf-edit",
    "crates/sheaf-ops",
    "crates/sheaf-image",
    "crates/sheaf-cli",
    "crates/sheaf-doc",
    "crates/sheaf-render",
    "crates/sheaf-ui",
    "crates/sheaf-ocr",
    "crates/sheaf-print",
    "crates/sheaf-plugin",
    "crates/sheaf-plugin-api",
    "crates/sheaf-app",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/sheaf"
rust-version = "1.98"

[workspace.dependencies]
sheaf-util = { path = "crates/sheaf-util" }
# Versioned as well: the plugin SDK (`sheaf-plugin-api`) depends on it.
sheaf-edit = { path = "crates/sheaf-edit", version = "0.1.0" }
sheaf-doc = { path = "crates/sheaf-doc" }
sheaf-render = { path = "crates/sheaf-render" }
sheaf-ui = { path = "crates/sheaf-ui" }
sheaf-ocr = { path = "crates/sheaf-ocr" }
sheaf-print = { path = "crates/sheaf-print" }
sheaf-plugin = { path = "crates/sheaf-plugin" }
sheaf-ops = { path = "crates/sheaf-ops" }
sheaf-image = { path = "crates/sheaf-image" }
sheaf-cli = { path = "crates/sheaf-cli" }

# GPUI comes from gpui-pre: Longbridge's weekly crates.io snapshot of Zed
# main, its crates renamed gpui-pre-*. 0.3.11 is zed@f816e1f. The sources are
# Zed's at that commit plus a few packaging edits marked "Modified for
# gpui-pre" (at 0.3.11: `$crate` paths in `actions!`, a gpui-kit path facade
# in the proc macros that does nothing unless the crate depends on gpui-kit,
# vendored sources for gpui-pre-apple's build.rs, and gpui-pre-wgpu adapted
# to crates.io's wgpu 30.0.1). Zed builds wgpu from git (cddb2f5, for
# gfx-rs/wgpu#10230, a Vulkan panic on surface teardown, and #10348, WebGL
# only) and gpui-pre can't publish that; a patch to that rev wouldn't build
# gpui-pre-wgpu's adapted sources, so sheaf ships 30.0.1 without the fix, as
# it shipped 29.0.4, until a 30.x release has it (`cargo update -p wgpu`).
# Cargo.lock holds icu_segmenter (GPUI's line breaking since 0.3.11) at
# Zed's 2.3.0: 2.4.0 has other break data, so a `cargo update` that moves
# it needs the same review. Since 0.3.11 GPUI's Metal shaders need macOS 12
# or later. sheaf keeps no patches
# against Zed, so it lets gpui-pre do the snapshotting. gpui-pre doesn't
# follow semver and breaking changes are routine: pin it exactly and bump it
# deliberately, with a compatibility check (docs/building.md, "Updating GPUI").
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }

# PDF engines. NOTE: the `pdfium` crate (newinnovations) is GPL-3 — do not use it.
pdfium-render = "0.9.4"
# One Flate backend across the workspace (D4, B26): zlib-rs.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"
futures = "0.3"
smallvec = "1"
# Sets of flags: what a change means for saving (sheaf-doc's effects).
bitflags = "2"
unicode-segmentation = "1"
im = "15"
# The document a plugin call reads, swapped in as it changes (sheaf-plugin).
arc-swap = "1.9.2"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
# Progress and cooperative cancel for ops, the CLI bar and plugin tasks:
# sheaf's own crate, published as sheaf-pdf/in-progress.
in-progress = "0.1"
# One sheaf per user and state folder: a later launch hands its files to
# the running sheaf. sheaf's own crate, published as
# sheaf-pdf/instance-handoff. Pinned exactly, as its README asks: until
# 0.1.0 a later alpha may change the API and what two builds share.
instance-handoff = "=0.1.0-alpha.2"
# The PDF family, from sheaf-pdf/pdf-lint main (M18): MIT OR Apache-2.0,
# and pdf-fonts `(MIT OR Apache-2.0) AND FTL`, for what its program
# reading takes from FreeType (packaging/licenses/LICENSE-freetype).
# pdf-lint itself (Apache-2.0) runs as a standalone CLI oracle in tests,
# never linked as a library.
pdf-objects = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main" }
pdf-filters = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", features = ["zlib-rs"] }
pdf-crypt = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main" }
pdf-structure = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", features = ["zlib-rs"] }
pdf-content-streams = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main" }
# Without their defaults: pdf-fonts reads programs and Adobe's predefined
# CMaps, and embeds a TrueType program cut to the glyphs a file draws
# (`embed`, which brings subsetter, pinned by pdf-fonts): the fallback
# font sheaf bundles (M10 slice 7). pdf-gfx interprets content and writes
# it again, and of its own features takes what lays text out in a font or
# in several (`text-layout`), and an embedded program as one of them
# (`embed`).
pdf-fonts = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", default-features = false, features = ["programs", "predefined-cmaps", "embed"] }
pdf-gfx = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", default-features = false, features = ["text-layout", "embed"] }
# Without its defaults too: `programs` would turn pdf-gfx's on, under the
# interpreter; `text-layout` is pdf-gfx's, which sheaf takes already.
pdf-annots = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", default-features = false, features = ["text-layout"] }
# And pdf-forms, for its text fields' appearances: `programs` would turn
# pdf-gfx's on, as pdf-annots' would; `text-layout`, which makes them, is
# pdf-annots' and pdf-gfx's, which sheaf takes already; `embed` draws a
# value in its field's font and the fallback font for what that can't.
pdf-forms = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", default-features = false, features = ["text-layout", "embed"] }
# And pdf-semantics, for the common structures sheaf reads and writes
# (the page tree's walk, name and number trees, XMP's conformance claims,
# the date a mark is made at): without its defaults, as the family's own
# crates take it, but with `clock`, for that date.
pdf-semantics = { git = "https://github.com/sheaf-pdf/pdf-lint", branch = "main", default-features = false, features = ["clock"] }

# Zed's workspace patches for crates GPUI uses, mirrored from the
# [patch.crates-io] of Zed's Cargo.toml at the snapshot's rev.
# Zed builds GPUI against these forks, but a published crate can't carry
# patches (gpui-pre's crates ask for the crates.io releases), so they are
# repeated here; keep them in step with Zed's on every bump. async-task is
# in every build, async-process, calloop and khronos-egl in the Linux one;
# windows-capture builds only with GPUI's screen-capture feature (off).
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
# Also Zed's build, though not from its patch block: Zed's
# crates/gpui_linux/Cargo.toml takes xim from its xim-rs fork at this rev,
# but the crates.io zed-xim that gpui-pre asks for resolves xim-ctext 0.3.0
# (2022). That can't decode unescaped Latin-1 (é from a dead key or
# Compose), ISO-8859 parts, GB2312 or KS C 5601, and zed-xim `expect`s the
# decode, so under X11 an input method (ibus, fcitx) committing any of them
# panics. Drop this once a zed-xim release depends on xim-ctext 0.4.
xim-ctext = { git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8" }
# Also Zed's build: Zed's Cargo.toml pins taffy `=0.15.0`, but gpui-pre's
# manifest asks for `0.15.0`, which resolves 0.15.1 (2026-10-25: about 500
# lines of layout changes, among them relative offsets in block and float
# layout, and baselines). This is taffy's v0.15.0 tag. Drop it once Zed pins
# a later taffy that gpui-pre resolves too, or gpui-pre keeps Zed's `=`.
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "eb6450694f33e2b7413e40677f230ff63f0fc194" }

[profile.dev]
# GPUI and PDFium bindings are unusably slow unoptimized; mirror Zed's approach.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Debug info for backtraces from users is worth more than the disk; keep
# panics unwinding so the save path can report instead of abort.
